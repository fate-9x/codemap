[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codemap"
version = "0.2.0"
description = "Revisa en lenguaje natural lo que cambió en un repositorio git (y lo que la IA dice que hizo)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codemap = "codemap_core.cli:main"

[tool.setuptools]
packages = ["codemap_core"]

[tool.setuptools.package-data]
codemap_core = ["templates/*.html", "defaults/*.json"]
