[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-diff"
version = "0.2.0"
description = "Revisa en lenguaje natural lo que cambió en un repositorio git (y lo que la IA dice que hizo)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nexus = "nexus_diff.cli:main"

[tool.setuptools]
packages = ["nexus_diff"]

[tool.setuptools.package-data]
nexus_diff = ["templates/*.html", "defaults/*.json"]
